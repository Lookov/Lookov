<svg xmlns="http://www.w3.org/2000/svg" width="760" height="132" viewBox="0 0 760 132" role="img" aria-label="lookov">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4FD8"/>
      <stop offset="50%" stop-color="#C74BFF"/>
      <stop offset="100%" stop-color="#FF3B6B"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feFlood flood-color="#FF4FD8" flood-opacity="0.75"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .pulse{animation:p 3.6s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:1}50%{opacity:.82}}
      @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
    </style>
  </defs>

  <g class="pulse" filter="url(#glow)">
    <text x="380" y="70" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="58" font-weight="800" letter-spacing="6" fill="url(#neon)">lookov</text>
  </g>
  <text x="380" y="104" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" letter-spacing="7" fill="#8A6E8C">◂ NEON / NIGHT / NOISE ▸</text>
</svg>
