<svg xmlns="http://www.w3.org/2000/svg" width="760" height="76" viewBox="0 0 760 76" role="img" aria-label="Contact: lookoffdev@gmail.com">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop class="a0" offset="0%" stop-color="#FF4FD8"/>
      <stop class="a1" offset="50%" stop-color="#C74BFF"/>
      <stop class="a2" offset="100%" stop-color="#FF3B6B"/>
    </linearGradient>
    <style>
      .a0{animation:c0 4.2s ease-in-out infinite}.a1{animation:c1 4.2s ease-in-out infinite}.a2{animation:c2 4.2s ease-in-out infinite}
      .cursor{animation:blink 1.15s steps(1,end) infinite}
      @keyframes c0{0%,100%{stop-color:#FF4FD8}50%{stop-color:#FF3B6B}}@keyframes c1{0%,100%{stop-color:#C74BFF}50%{stop-color:#FF4FD8}}@keyframes c2{0%,100%{stop-color:#FF3B6B}50%{stop-color:#C74BFF}}
      @keyframes blink{0%,46%{opacity:1}47%,100%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.a0,.a1,.a2,.cursor{animation:none}}
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="75" rx="10" fill="#0B0710" stroke="#241826"/>
  <rect x="0" y="8" width="3" height="60" rx="1.5" fill="url(#accent)"/>

  <text x="24" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.6" fill="#8A6E8C">// CONTACT</text>
  <text x="736" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.3" fill="#8A6E8C" text-anchor="end">SAY HI</text>
  <text x="24" y="53" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="0.5" fill="#F0DCEF">lookoffdev@gmail.com<tspan class="cursor" fill="#C74BFF"> ▮</tspan></text>
</svg>
